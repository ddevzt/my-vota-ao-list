<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniVault Pro - Gerenciador Robusto de Animes</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0b0f19',
              card: '#111827',
              surface: '#1f2937',
              border: '#374151',
              primary: '#6366f1',
              primaryHover: '#4f46e5',
              accent: '#38bdf8'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Estilização da barra de rolagem para Dark Mode */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-brand-bg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-primary selection:text-white">

  <!-- Header Superior -->
  <header class="border-b border-brand-border bg-brand-bg/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-brand-accent flex items-center justify-center font-black text-white text-lg shadow-lg shadow-brand-primary/20">
          A
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-wide text-white block leading-none">AniVault</span>
          <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Standalone Hub</span>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="ui.abrirModalNovoAnime()" class="px-3.5 py-1.5 bg-brand-primary hover:bg-brand-primaryHover text-white text-xs font-bold rounded-lg shadow-md transition flex items-center gap-1.5">
          <span>+</span> Novo Anime
        </button>
      </div>
    </div>
  </header>

  <!-- Corpo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
    
    <!-- Painel de Métricas Rápidas -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-brand-card border border-brand-border p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">Total Catalogado</span>
        <span id="metric-total" class="text-2xl font-black text-white">0</span>
      </div>
      <div class="bg-brand-card border border-brand-border p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">Assistindo Agora</span>
        <span id="metric-assistindo" class="text-2xl font-black text-brand-accent">0</span>
      </div>
      <div class="bg-brand-card border border-brand-border p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">Completados</span>
        <span id="metric-completos" class="text-2xl font-black text-emerald-400">0</span>
      </div>
      <div class="bg-brand-card border border-brand-border p-4 rounded-xl">
        <span class="text-xs text-slate-400 block font-medium">Média Geral de Notas</span>
        <span id="metric-media" class="text-2xl font-black text-amber-400">0.0</span>
      </div>
    </section>

    <!-- Barra de Controles e Filtros -->
    <section class="bg-brand-card border border-brand-border p-4 rounded-xl flex flex-col md:flex-row gap-3 items-center justify-between shadow-sm">
      <div class="relative w-full md:w-80">
        <input 
          id="filtro-busca" 
          type="text" 
          placeholder="Filtrar por título..." 
          oninput="app.aplicarFiltros()"
          class="w-full bg-brand-surface border border-brand-border rounded-lg pl-9 pr-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-primary"
        />
        <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <!-- Status -->
        <select id="filtro-status" onchange="app.aplicarFiltros()" class="bg-brand-surface border border-brand-border rounded-lg px-2.5 py-2 text-xs text-slate-300 focus:outline-none focus:border-brand-primary">
          <option value="">Todos os Status</option>
          <option value="Assistindo">Assistindo</option>
          <option value="Completo">Completo</option>
          <option value="Planejado">Planejado</option>
          <option value="Pausado">Pausado</option>
        </select>

        <!-- Gênero -->
        <select id="filtro-genero" onchange="app.aplicarFiltros()" class="bg-brand-surface border border-brand-border rounded-lg px-2.5 py-2 text-xs text-slate-300 focus:outline-none focus:border-brand-primary">
          <option value="">Todos os Gêneros</option>
        </select>

        <!-- Ordenação -->
        <select id="filtro-ordem" onchange="app.aplicarFiltros()" class="bg-brand-surface border border-brand-border rounded-lg px-2.5 py-2 text-xs text-slate-300 focus:outline-none focus:border-brand-primary">
          <option value="nota-desc">Maior Nota</option>
          <option value="nota-asc">Menor Nota</option>
          <option value="titulo-asc">Título (A-Z)</option>
          <option value="ano-desc">Mais Recente</option>
        </select>
      </div>
    </section>

    <!-- Grid de Cards de Animes -->
    <section>
      <div id="grade-animes" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Injetado dinamicamente via JS -->
      </div>
      <div id="grade-vazia" class="hidden text-center py-16 bg-brand-card/40 border border-brand-border rounded-xl">
        <p class="text-sm text-slate-400">Nenhum anime encontrado com os critérios selecionados.</p>
      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="border-t border-brand-border bg-brand-bg py-5 text-center text-xs text-slate-500">
    AniVault Pro — Arquitetura de Dados Própria, Segura e Desacoplada de APIs Externas.
  </footer>

  <!-- Modal de Cadastro / Edição -->
  <div id="modal-anime" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-brand-border pb-3">
        <h3 id="modal-titulo" class="font-bold text-base text-white">Adicionar Novo Anime</h3>
        <button onclick="ui.fecharModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
      </div>

      <form id="form-anime" onsubmit="app.salvarAnime(event)" class="space-y-3">
        <input type="hidden" id="form-id" />

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Título do Anime *</label>
          <input type="text" id="form-titulo" required class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Ex: Fullmetal Alchemist: Brotherhood" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Gênero Principal *</label>
            <input type="text" id="form-genero" required class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Ex: Shounen, Sci-Fi" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Ano de Lançamento</label>
            <input type="number" id="form-ano" min="1960" max="2099" class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Ex: 2009" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nota (0 a 10) *</label>
            <input type="number" step="0.1" min="0" max="10" id="form-nota" required class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Ex: 9.1" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Episódios</label>
            <input type="number" min="1" id="form-episodios" class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Ex: 64" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Status *</label>
            <select id="form-status" class="w-full bg-brand-surface border border-brand-border rounded-lg px-2 py-2 text-xs text-white focus:outline-none focus:border-brand-primary">
              <option value="Assistindo">Assistindo</option>
              <option value="Completo">Completo</option>
              <option value="Planejado">Planejado</option>
              <option value="Pausado">Pausado</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">URL da Imagem da Capa</label>
          <input type="url" id="form-imagem" class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="https://exemplo.com/capa.jpg" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Sinopse</label>
          <textarea id="form-sinopse" rows="3" class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-primary" placeholder="Breve resumo da história..."></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-brand-border">
          <button type="button" onclick="ui.fecharModal()" class="px-4 py-2 bg-brand-surface hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-brand-primary hover:bg-brand-primaryHover text-xs text-white font-bold rounded-lg transition">Salvar Dados</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT MODULAR ARQUITETADO -->
  <script>
    /**
     * CAMADA 1: REPOSITÓRIO E PERSISTÊNCIA LOCAL (MODEL)
     * Abstração dos dados para desacoplar a interface do mecanismo de gravação.
     */
    class AnimeRepository {
      constructor() {
        this.STORAGE_KEY = 'anivault_records_v1';
        this.inicializarDadosBase();
      }

      obterTodos() {
        try {
          const dados = localStorage.getItem(this.STORAGE_KEY);
          return dados ? JSON.parse(dados) : [];
        } catch (e) {
          console.error("Falha ao ler dados locais:", e);
          return [];
        }
      }

      salvar(anime) {
        const animes = this.obterTodos();
        if (anime.id) {
          // Atualização de registro existente
          const index = animes.findIndex(a => a.id === anime.id);
          if (index !== -1) animes[index] = { ...anime, atualizadoEm: new Date().toISOString() };
        } else {
          // Criação com ID único resiliente
          anime.id = 'ani_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
          anime.criadoEm = new Date().toISOString();
          animes.push(anime);
        }
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(animes));
        return anime;
      }

      remover(id) {
        let animes = this.obterTodos();
        animes = animes.filter(a => a.id !== id);
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(animes));
      }

      obterPorId(id) {
        return this.obterTodos().find(a => a.id === id) || null;
      }

      // Seed inicial de segurança caso a base esteja vazia no primeiro carregamento
      inicializarDadosBase() {
        if (!localStorage.getItem(this.STORAGE_KEY)) {
          const seed = [
            {
              id: 'ani_seed_1',
              titulo: 'Frieren: Beyond Journey\'s End',
              genero: 'Fantasia',
              ano: 2023,
              nota: 9.3,
              episodios: 28,
              status: 'Completo',
              imagem: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60',
              sinopse: 'A maga elfa Frieren reflete sobre a mortalidade e o valor das relações humanas após a derrota do Rei Demônio.'
            },
            {
              id: 'ani_seed_2',
              titulo: 'Vinland Saga',
              genero: 'Ação / Histórico',
              ano: 2019,
              nota: 8.9,
              episodios: 48,
              status: 'Assistindo',
              imagem: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=60',
              sinopse: 'A jornada de Thorfinn em busca de vingança e, posteriormente, pelo verdadeiro significado de ser um guerreiro.'
            },
            {
              id: 'ani_seed_3',
              titulo: 'Steins;Gate',
              genero: 'Sci-Fi',
              ano: 2011,
              nota: 9.1,
              episodios: 24,
              status: 'Completo',
              imagem: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop&q=60',
              sinopse: 'Um grupo de amigos inventa acidentalmente uma máquina do tempo e precisa lidar com as consequências de alterar linhas temporais.'
            }
          ];
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seed));
        }
      }
    }

    /**
     * CAMADA 2: CONTROLE DE INTERFACE (VIEW)
     * Sanitização, templates HTML e gerenciamento de modais.
     */
    class AnimeUI {
      constructor() {
        this.grade = document.getElementById('grade-animes');
        this.gradeVazia = document.getElementById('grade-vazia');
        this.modal = document.getElementById('modal-anime');
        this.form = document.getElementById('form-anime');
      }

      // Prevenção estrita de Cross-Site Scripting (XSS)
      escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      renderizarGrade(animes) {
        this.grade.innerHTML = '';
        if (animes.length === 0) {
          this.gradeVazia.classList.remove('hidden');
          return;
        }
        this.gradeVazia.classList.add('hidden');

        animes.forEach(anime => {
          const card = document.createElement('div');
          card.className = "bg-brand-card border border-brand-border rounded-xl overflow-hidden flex flex-col group hover:border-brand-primary/60 transition shadow-sm";

          const corStatus = {
            'Assistindo': 'bg-sky-500/20 text-sky-400 border border-sky-500/30',
            'Completo': 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30',
            'Planejado': 'bg-slate-500/20 text-slate-300 border border-slate-500/30',
            'Pausado': 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
          }[anime.status] || 'bg-slate-700 text-slate-300';

          const imgCapa = anime.imagem ? this.escapeHTML(anime.imagem) : 'https://placehold.co/400x600/111827/475569?text=Sem+Capa';

          card.innerHTML = `
            <div class="aspect-[3/4] relative overflow-hidden bg-brand-surface">
              <img src="${imgCapa}" alt="${this.escapeHTML(anime.titulo)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x600/111827/475569?text=Erro+Imagem';" loading="lazy">
              <div class="absolute top-2 right-2 px-2 py-0.5 bg-black/70 backdrop-blur rounded text-xs font-bold text-amber-400 shadow">
                ★ ${anime.nota ? Number(anime.nota).toFixed(1) : '-'}
              </div>
              <div class="absolute bottom-2 left-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${corStatus}">
                  ${this.escapeHTML(anime.status)}
                </span>
              </div>
            </div>
            
            <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
              <div>
                <h3 class="text-xs font-bold text-white line-clamp-1" title="${this.escapeHTML(anime.titulo)}">${this.escapeHTML(anime.titulo)}</h3>
                <p class="text-[10px] text-slate-400">${this.escapeHTML(anime.genero)} • ${anime.ano || 'N/A'}</p>
                <p class="text-[10px] text-slate-400">${anime.episodios ? anime.episodios + ' eps' : 'Episódios N/A'}</p>
              </div>

              <div class="pt-2 border-t border-brand-border flex items-center justify-between text-[11px]">
                <button onclick="app.editarAnime('${anime.id}')" class="text-brand-accent hover:underline font-medium">Editar</button>
                <button onclick="app.removerAnime('${anime.id}')" class="text-rose-400 hover:underline font-medium">Excluir</button>
              </div>
            </div>
          `;
          this.grade.appendChild(card);
        });
      }

      atualizarMetricas(animes) {
        const total = animes.length;
        const assistindo = animes.filter(a => a.status === 'Assistindo').length;
        const completos = animes.filter(a => a.status === 'Completo').length;
        
        const somaNotas = animes.reduce((acc, a) => acc + (Number(a.nota) || 0), 0);
        const media = total > 0 ? (somaNotas / total).toFixed(1) : '0.0';

        document.getElementById('metric-total').innerText = total;
        document.getElementById('metric-assistindo').innerText = assistindo;
        document.getElementById('metric-completos').innerText = completos;
        document.getElementById('metric-media').innerText = media;
      }

      popularFiltroGeneros(animes) {
        const select = document.getElementById('filtro-genero');
        const valorAtual = select.value;
        const generos = new Set();

        animes.forEach(a => {
          if (a.genero) {
            a.genero.split(',').forEach(g => generos.add(g.trim()));
          }
        });

        select.innerHTML = '<option value="">Todos os Gêneros</option>';
        Array.from(generos).sort().forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          if (g === valorAtual) opt.selected = true;
          select.appendChild(opt);
        });
      }

      abrirModalNovoAnime() {
        this.form.reset();
        document.getElementById('form-id').value = '';
        document.getElementById('modal-titulo').innerText = 'Adicionar Novo Anime';
        this.modal.classList.remove('hidden');
        this.modal.classList.add('flex');
      }

      abrirModalEdicao(anime) {
        document.getElementById('form-id').value = anime.id;
        document.getElementById('form-titulo').value = anime.titulo || '';
        document.getElementById('form-genero').value = anime.genero || '';
        document.getElementById('form-ano').value = anime.ano || '';
        document.getElementById('form-nota').value = anime.nota || '';
        document.getElementById('form-episodios').value = anime.episodios || '';
        document.getElementById('form-status').value = anime.status || 'Assistindo';
        document.getElementById('form-imagem').value = anime.imagem || '';
        document.getElementById('form-sinopse').value = anime.sinopse || '';
        
        document.getElementById('modal-titulo').innerText = 'Editar Anime';
        this.modal.classList.remove('hidden');
        this.modal.classList.add('flex');
      }

      fecharModal() {
        this.modal.classList.add('hidden');
        this.modal.classList.remove('flex');
      }
    }

    /**
     * CAMADA 3: NÚCLEO E REGRAS DE NEGÓCIO (CONTROLLER)
     * Coordena eventos, filtragem, ordenação e sincronização.
     */
    class AnimeApp {
      constructor(repo, ui) {
        this.repo = repo;
        this.ui = ui;
        this.iniciar();
      }

      iniciar() {
        const animes = this.repo.obterTodos();
        this.ui.popularFiltroGeneros(animes);
        this.ui.atualizarMetricas(animes);
        this.aplicarFiltros();
      }

      aplicarFiltros() {
        const busca = document.getElementById('filtro-busca').value.trim().toLowerCase();
        const status = document.getElementById('filtro-status').value;
        const genero = document.getElementById('filtro-genero').value;
        const ordem = document.getElementById('filtro-ordem').value;

        let lista = this.repo.obterTodos();

        // 1. Filtro textual
        if (busca) {
          lista = lista.filter(a => a.titulo.toLowerCase().includes(busca));
        }

        // 2. Filtro por status
        if (status) {
          lista = lista.filter(a => a.status === status);
        }

        // 3. Filtro por gênero
        if (genero) {
          lista = lista.filter(a => a.genero && a.genero.toLowerCase().includes(genero.toLowerCase()));
        }

        // 4. Ordenação pura
        lista.sort((a, b) => {
          if (ordem === 'nota-desc') return (Number(b.nota) || 0) - (Number(a.nota) || 0);
          if (ordem === 'nota-asc') return (Number(a.nota) || 0) - (Number(b.nota) || 0);
          if (ordem === 'ano-desc') return (Number(b.ano) || 0) - (Number(a.ano) || 0);
          if (ordem === 'titulo-asc') return a.titulo.localeCompare(b.titulo);
          return 0;
        });

        this.ui.renderizarGrade(lista);
      }

      salvarAnime(event) {
        event.preventDefault();

        const id = document.getElementById('form-id').value;
        const payload = {
          id: id ? id : null,
          titulo: document.getElementById('form-titulo').value.trim(),
          genero: document.getElementById('form-genero').value.trim(),
          ano: parseInt(document.getElementById('form-ano').value, 10) || null,
          nota: parseFloat(document.getElementById('form-nota').value) || 0,
          episodios: parseInt(document.getElementById('form-episodios').value, 10) || null,
          status: document.getElementById('form-status').value,
          imagem: document.getElementById('form-imagem').value.trim(),
          sinopse: document.getElementById('form-sinopse').value.trim()
        };

        this.repo.salvar(payload);
        this.ui.fecharModal();
        
        const atualizados = this.repo.obterTodos();
        this.ui.popularFiltroGeneros(atualizados);
        this.ui.atualizarMetricas(atualizados);
        this.aplicarFiltros();
      }

      editarAnime(id) {
        const anime = this.repo.obterPorId(id);
        if (anime) {
          this.ui.abrirModalEdicao(anime);
        }
      }

      removerAnime(id) {
        if (confirm('Tem certeza de que deseja remover este anime da sua base local?')) {
          this.repo.remover(id);
          const atualizados = this.repo.obterTodos();
          this.ui.popularFiltroGeneros(atualizados);
          this.ui.atualizarMetricas(atualizados);
          this.aplicarFiltros();
        }
      }
    }

    // Instanciação e Inicialização da Aplicação
    const repo = new AnimeRepository();
    const ui = new AnimeUI();
